<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10140f">
<title>TRU QUIET</title>
<style>
:root{--bg:#10140f;--ink:#e7f0dc;--dim:#a8b89a;--line:#2c3824;--leaf:#c6d86a;--card:#1a2216;--bad:#c4543a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--leaf)}
.sub{color:var(--dim);font-size:13px}
.warn{margin:10px 16px;padding:10px 12px;border:1px solid var(--bad);border-radius:10px;font-size:14px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#0c100a;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--leaf);color:#14180f;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--leaf);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header><h1>TRU <span>QUIET</span></h1><p class="sub">Light, sound, smoke. What gives you away. Not a sentry manual.</p></header>
<div class="warn">Save the file. Open it in a browser. If it needs a network to run, it is not a lane. Watch holds the relief and the challenge word.</div>
<div class="bar"><input id="q" placeholder="light, smoke, sound…" enterkeyhint="search"><button id="send">Send</button></div>
<main id="out"></main>
<script>
var C=[
{t:"Three tells",d:"Light, sound, and smoke give a camp away farther than a voice carries in the day. Close one and the other two still talk."},
{t:"Light",d:"A flame, a lamp, and a screen read from a ridge. Keep the light below the line of sight, or out. A fire in a pit is dimmer than a fire in the open. Fire holds the site and the dead-out. This card does not build the pit."},
{t:"Sound",d:"Metal on metal, a cough, a snapped stick, a voice across water. Water carries sound. Work by touch once the light is gone. Whisper is still sound."},
{t:"Smoke",d:"Smoke is a column by day and a smell by night. Dry wood smokes less than green wood. No fire is the only card with no smoke. Do not stand in the column."},
{t:"Shape",d:"A person on a skyline is a shape before they are a face. Stay off the crest. Break the outline with the ground, not with a new color you invent."},
{t:"Gap",d:"No sentry roster. No patrol interval. No hide build. Watch holds one awake, a relief, and a challenge word. This card stops at what gives you away."}
];
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&","<":"<",">":">"}[c];});}
function card(x){return '<article class="card"><div class="k">QUIET</div><div class="big">'+esc(x.t)+'</div><div>'+esc(x.d)+'</div><div class="src">What gives you away. Not a field manual chapter.</div></article>';}
function show(l){document.getElementById("out").innerHTML=l.map(card).join("");}
function search(q){q=(q||"").trim().toLowerCase(); if(!q){show(C);return;} var h=C.filter(function(x){return (x.t+" "+x.d).toLowerCase().indexOf(q)>=0;}); document.getElementById("out").innerHTML=h.length?h.map(card).join(""):'<article class="card"><div class="k">GAP</div><div class="big">Not packed</div><div>No invented drill.</div></article>';}
document.getElementById("send").onclick=function(){search(document.getElementById("q").value);};
document.getElementById("q").onkeydown=function(e){if(e.key==="Enter") search(e.target.value);};
show(C);
</script>
</body>
</html>
